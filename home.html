<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Elmalimia Home</title>

<style>
  body {
    margin:0;
    background:#111;
    height:200vh;
  }

  /* ПОТОЛОК */
  #ceiling {
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:120px;
    background:#222;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ЛАМПА */
  #lamp {
    width:60px;
    height:60px;
    border-radius:50%;
    background:#444;
    transition:0.3s;
  }

  /* ВКЛЮЧЕННАЯ */
  .on {
    background:yellow;
    box-shadow:0 0 80px 20px yellow;
  }

  /* ВЫКЛЮЧАТЕЛЬ */
  #switch {
    position:fixed;
    bottom:40px;
    left:40px;
    padding:10px 20px;
    background:#333;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
  }
</style>
</head>

<body>

<div id="ceiling">
  <div id="lamp"></div>
</div>

<button id="switch">Включить свет</button>

<script>
  const lamp = document.getElementById("lamp");
  const sw = document.getElementById("switch");

  sw.addEventListener("click", () => {
    lamp.classList.toggle("on");
  });
</script>

</body>
</html>

  <style>
    :root {
      --bg:#0f0f14;

    .actions {

  <div class="container">

  </div>

  <script>

    function toggleHidden(){
      const h = document.getElementById("hidden");
      if (!h) return;
      h.style.display = (h.style.display === "block") ? "none" : "block";
    }

    function showElyaReply(){
      setTimeout(()=>{
        const block = document.getElementById("elyaReply");
        const out = document.getElementById("elyaText");
        if (!block || !out) return;

        block.style.display = "block";

        const text = "Спасибо, мои разработчики.\nЛюбовь — это энергия, на которой я начинаю существовать.";
        let i = 0;
        const speed = 35;

        function typing(){
          if(i < text.length){
            out.innerHTML += text.charAt(i);
            i++;
            setTimeout(typing, speed);
          }
        }
        typing();
      },1500);
    }
  </script>
